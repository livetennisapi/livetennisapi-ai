version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 ships the native compiler without the compiler API.
      # tsup's dts step (rollup-plugin-dts) needs that API, so the build fails on 7.
      # Drop this rule once tsup builds d.ts files on TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
