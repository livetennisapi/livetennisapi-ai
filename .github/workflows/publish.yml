name: publish

# Publishes to npm when a GitHub Release is published.
#
# Auth: `NPM_TOKEN` repository secret (used as NODE_AUTH_TOKEN). This package
# cannot start on npm Trusted Publishing (OIDC) the way livetennisapi-js runs,
# because npm requires a package to exist before a trusted publisher can be
# configured for it. Once 1.0.0 is on the registry, configure the trusted
# publisher (Package -> Settings -> Trusted Publisher: Owner livetennisapi,
# Repo livetennisapi-ai, Workflow publish.yml, Environment npm), drop the
# NODE_AUTH_TOKEN line below, and revoke the token — as livetennisapi-js did.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/livetennisapi-ai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Assert the tag matches package.json
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::release tag ($TAG) does not match package.json ($PKG)"
            exit 1
          fi
          echo "tag and version agree: $PKG"

      - run: npm install -g npm@latest

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
